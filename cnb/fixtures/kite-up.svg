<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="-200 -200 400 400">
  <!-- Session-set 007: Kite (up) notehead in music-glyph-toolkit output format,
       for authoring the Kite 4-369 system through the Module 16 SVG importer.
       Geometry matches the engine repo's cnb:kite-base-shape (kite pointing up,
       4 semitones tall, 100 SVG units per semitone).
       Session 11 (audit H2): the data-lilypond-* values are the toolkit's own
       output for these paths, format_scheme(parse_and_normalize(d)) wrapped as
       the toolkit writes them: SEMITONE units, Y up (SVG units / 100, Y
       negated). The exporter divides them by the staff's semitones per staff
       space. Session 40: a stem goes where its rect puts it, centred on the
       rect, so the crotchet rects, centred on x 0, centre the crotchet stems,
       and the minim rects centre the minim stems at x -/+73 SVG units
       (-/+0.73 semitones). The rects' ends, y -/+180 SVG units (+/-1.8
       semitones), are where the stems start.
       cnb/fixtures/rebuild-kite-shapes.mjs rebuilds kite-4-369-config.json's
       shapes from this file through the importer. -->
  <g id="layer1">
    <rect id="stem-down" x="-10" y="180" width="20" height="350" style="fill:#00FFFF;stroke:none"/>
    <rect id="stem-up" x="-10" y="-530" width="20" height="350" style="fill:#FF00FF;stroke:none"/>
    <rect id="stem-minim-down" x="63" y="180" width="20" height="350" style="fill:#00FFFF;stroke:none"/>
    <rect id="stem-minim-up" x="-83" y="-530" width="20" height="350" style="fill:#FF00FF;stroke:none"/>
    <path id="notehead"
          d="M 0 -200 L 200 -100 L 0 200 L -200 -100 L 0 -200 Z"
          data-semitone-height="4"
          data-lilypond-notehead="'(&#10;    (moveto 0.0 2.0)&#10;    (lineto 2.0 1.0)&#10;    (lineto 0.0 -2.0)&#10;    (lineto -2.0 1.0)&#10;    (lineto 0.0 2.0)&#10;    (closepath))"
          style="fill:#000000;stroke:none"/>
    <path id="hollow"
          d="M 100 -100 L 0 100 L -100 -100 L 100 -100 Z"
          data-lilypond-hollow="'(&#10;    (moveto 1.0 1.0)&#10;    (lineto 0.0 -1.0)&#10;    (lineto -1.0 1.0)&#10;    (lineto 1.0 1.0)&#10;    (closepath))"
          style="fill:#FFFFFF;stroke:none"/>
  </g>
</svg>
