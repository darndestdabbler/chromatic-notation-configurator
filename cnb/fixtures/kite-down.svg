<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="-200 -200 400 400">
  <!-- Session-set 007: Kite (down) notehead in music-glyph-toolkit output
       format — the 180-degree rotated variant, matching the engine repo's
       (cnb:rotate-path cnb:kite-base-shape 180) with clean coordinates.
       Stem placemarker rects (crotchet and minim pairs) are identical to
       kite-up.svg: the engine's shared center-top attachment puts stems at
       the same points for both orientations.
       Session 11 (audit H2): the data-lilypond-* values are the toolkit's own
       output for these paths (SEMITONE units, Y up); see kite-up.svg. -->
  <g id="layer1">
    <rect id="stem-down" x="-10" y="270" width="20" height="350" style="fill:#00FFFF;stroke:none"/>
    <rect id="stem-up" x="-10" y="-620" width="20" height="350" style="fill:#FF00FF;stroke:none"/>
    <rect id="stem-minim-down" x="99.5" y="270" width="20" height="350" style="fill:#00FFFF;stroke:none"/>
    <rect id="stem-minim-up" x="-119.5" y="-620" width="20" height="350" style="fill:#FF00FF;stroke:none"/>
    <path id="notehead"
          d="M 0 200 L -200 100 L 0 -200 L 200 100 L 0 200 Z"
          data-semitone-height="4"
          data-lilypond-notehead="'(&#10;    (moveto 0.0 -2.0)&#10;    (lineto -2.0 -1.0)&#10;    (lineto 0.0 2.0)&#10;    (lineto 2.0 -1.0)&#10;    (lineto 0.0 -2.0)&#10;    (closepath))"
          style="fill:#000000;stroke:none"/>
    <path id="hollow"
          d="M -100 100 L 0 -100 L 100 100 L -100 100 Z"
          data-lilypond-hollow="'(&#10;    (moveto -1.0 -1.0)&#10;    (lineto 0.0 1.0)&#10;    (lineto 1.0 -1.0)&#10;    (lineto -1.0 -1.0)&#10;    (closepath))"
          style="fill:#FFFFFF;stroke:none"/>
  </g>
</svg>
