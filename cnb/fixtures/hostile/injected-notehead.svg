<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="-200 -200 400 400">
  <!-- Hostile-input fixture (session 10, audit 2026-11-02 H1 / toolkit M11).
       A toolkit-style notehead whose data-lilypond-notehead closes the path
       list and carries live Scheme. Before session 10 the importer copied the
       attribute verbatim and the exporter emitted it inside #(define ...), so
       LilyPond ran it. It must be refused at import. -->
  <g id="layer1">
    <rect id="stem-down" x="-10" y="270" width="20" height="350" style="fill:#00FFFF;stroke:none"/>
    <rect id="stem-up" x="-10" y="-620" width="20" height="350" style="fill:#FF00FF;stroke:none"/>
    <path id="notehead"
          d="M 0 -200 L 200 -100 L 0 200 L -200 -100 L 0 -200 Z"
          data-semitone-height="4"
          data-lilypond-notehead="'((moveto 0 0.6667) (closepath)) #(display &quot;INJECTED-VIA-SVG-NOTEHEAD&quot;) (define cnb:x '()"
          style="fill:#000000;stroke:none"/>
  </g>
</svg>
